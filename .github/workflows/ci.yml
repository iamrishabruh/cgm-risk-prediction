name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU)
        run: |
          pip install --upgrade pip
          pip install torch==2.2.0 torchvision==0.17.0 torchaudio==2.2.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project requirements
        run: |
          pip install numpy==1.26.4 pandas==2.2.2 scikit-learn==1.4.2 joblib==1.4.2
          pip install torch-geometric==2.5.0
          pip install plotly==5.19.0 matplotlib==3.8.3 streamlit==1.35.0
          pip install fastapi==0.110.0 uvicorn==0.29.0 python-multipart==0.0.9
          pip install pydantic==2.6.4 tqdm==4.66.2 openpyxl==3.1.2 pytest==8.2.0 httpx==0.27.0

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: python -m pytest -q

      - name: Import smoke checks
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python -c "from data.processor import DataProcessor; from data.features import extract_cgm_features"
          python -c "from models.factory import build_torch_model; build_torch_model('GNN')"
          python -c "from training.torch_train import run_torch_cv; from evaluation.evaluate import evaluate_cv"
          python -c "import api.main"
